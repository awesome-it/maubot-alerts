[build-system]
requires = ["setuptools==81.*", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "maubot-alerts"
version = "0.4.0"
description = "A Maubot plugin for alerting via Matrix"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["maubot==0.6.0", "setuptools==81.*"]
license = "AGPL-3.0-only"
license-files = ["LICENSE"]

[tool.setuptools]
packages = ["alertbot"]

[tool.setuptools.package-data]
alertbot = ["templates/*.jinja"]

[dependency-groups]
dev = [
  "pytest>=8.3.0",
  "pytest-asyncio>=0.24.0",
  "pytest-cov>=7.0.0",
  "pytest-mock>=3.15.1",
]
[tool.ruff]
line-length = 110
target-version = "py310"
